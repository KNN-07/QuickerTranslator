[package]
name = "quickertranslator"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "QuickTranslator offline dictionary editor and translation workspace"

[lib]
name = "quickertranslator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quickertranslator"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native", "bundled-dictionaries"]
native = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-clipboard-manager",
]
custom-protocol = ["native", "tauri/custom-protocol"]
# Production builds require the real prepared datasets and their license notices.
bundled-dictionaries = []

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true , features = [] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dependencies]
tauri = { version = "=2.12.1", optional = true , features = [] }
tauri-plugin-dialog = { version = "=2.8.1", optional = true }
tauri-plugin-clipboard-manager = { version = "=2.4.1", optional = true }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
zeroize = "=1.9.0"
bytes = "=1.12.1"
parking_lot = "=0.12.5"
encoding_rs = "=0.8.42"
chardetng = "=1.0.0"
# 6.2.0 is the published stable release; its Segmenter API matches the inspected 7 documentation.
lindera = { version = "=6.2.0", default-features = false, features = ["embed-ipadic"] }
regex = "=1.13.1"
docx-rs = { version = "=0.4.22", default-features = false }
scraper = { version = "=0.27.0", default-features = false }
tempfile = "=3.27.0"
uuid = { version = "=1.27.0", features = ["v4"] }
