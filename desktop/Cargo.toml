[package]
name = "quicktranslator-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
quickertranslator = { path = "../src-tauri", default-features = false, features = ["bundled-dictionaries"] }
dirs = "6"
serde_json = "1"
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
gpui-component-assets = "=0.5.1"
